[project]
name = "happycake-wrapper"
version = "0.1.0"
description = "FastAPI wrapper for HappyCake — bridges customer channels (IG/WA) and on-site chat to claude -p, with owner Telegram handoff."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "python-telegram-bot>=21.6",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  # Semantic customer memory. Architecture mirrors the maintainer's
  # tai-memory project (Postgres + pgvector + local fastembed); for the
  # hackathon submission the embedding+similarity layer ships in-process
  # so an evaluator clone has no external Postgres dependency.
  "fastembed>=0.4",
  "numpy>=1.26",
  # Rate limiting on /chat and /franchise so a bored adversary can't burn
  # Claude credits or DoS the FastAPI app.
  "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["happycake_wrapper"]
package-dir = {"happycake_wrapper" = "src"}
